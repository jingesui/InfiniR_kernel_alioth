name: Build Kernel (alioth-stock + Droidspaces + KernelSU)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: '13.0-alioth'
        type: choice
        options:
          - 13.0-alioth
          - 14.0-alioth
          - 15.0-alioth
          - 16.0-alioth
      defconfig:
        description: 'Defconfig to use'
        required: false
        default: 'alioth_stock-defconfig'
        type: choice
        options:
          - alioth_stock-defconfig
          - alioth_defconfig

env:
  TARGET_ARCH: arm64
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'alioth_stock-defconfig' }}
  BRANCH: ${{ github.event.inputs.branch || '13.0-alioth' }}

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.BRANCH }}

      - name: Add Swap (5GB)
        run: |
          sudo fallocate -l 5G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bc curl libssl-dev git zip \
            python3 python3-pip flex cpio libncurses5-dev wget \
            patchelf llvm lld
          sudo pip3 install pyelftools

      - name: Setup toolchain
        run: |
          cd /tmp
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git \
            --depth=1 -b 11 clang
          echo "/tmp/clang/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/tmp/clang/lib64:\${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 \
            --depth=1 /tmp/gas
          echo "/tmp/gas" >> $GITHUB_PATH
          git clone https://github.com/UtsavBalar1231/Anykernel3 \
            --depth=1 -b kona anykernel

      - name: Update KernelSU to latest
        run: |
          rm -rf KernelSU .gitmodules 2>/dev/null || true
          git clone --depth 1 https://github.com/tiann/KernelSU.git /tmp/KernelSU-src
          mkdir -p KernelSU
          cp -r /tmp/KernelSU-src/kernel/* KernelSU/
          rm -rf /tmp/KernelSU-src
          echo "KernelSU source updated to latest main"

      - name: Apply Droidspaces kernel config
        run: |
          cat >> arch/arm64/configs/$DEFCONFIG << 'DROIDSPACES'

          # Droidspaces mandatory kernel configuration
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NF_TABLES=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_USER_NS=y
DROIDSPACES
          echo "Droidspaces config applied to $DEFCONFIG"

      - name: Verify config options
        run: |
          echo "=== Checking critical droidspaces config ==="
          for opt in SYSVIPC POSIX_MQUEUE PID_NS IPC_NS DEVTMPFS CGROUP_DEVICE \
                     CGROUP_PIDS BRIDGE_NETFILTER NF_TABLES USER_NS; do
            grep -q "CONFIG_${opt}=y" arch/arm64/configs/$DEFCONFIG && \
              echo "  CONFIG_${opt}=y" || echo "  CONFIG_${opt}=y MISSING"
          done

      - name: Apply Droidspaces non-GKI patches
        run: |
          sed -i 's/struct rtnl_link_stats64 dev_stats, \*stats;/struct rtnl_link_stats64 *stats;/' \
            net/netfilter/xt_qtaguid.c 2>/dev/null || true
          sed -i '/if (iface_entry->active) {/,/} else {/c\	stats = \&no_dev_stats;' \
            net/netfilter/xt_qtaguid.c 2>/dev/null || true
          sed -i '/dev_get_stats/d' net/netfilter/xt_qtaguid.c 2>/dev/null || true
          echo "Patch 1 (xt_qtaguid) applied"
          
          LINE=$(grep -n "spin_unlock_irq(&cgroup_file_kn_lock)" kernel/cgroup/cgroup.c | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            sed -i "${LINE}a\
	if (cft->ss \&\& (cgrp->root->flags \& CGRP_ROOT_NOPREFIX) \&\& !(cft->flags \& CFTYPE_NO_PREFIX)) {
				snprintf(name, CGROUP_FILE_NAME_MAX, \"%s.%s\", cft->ss->name, cft->name);
				kernfs_create_link(cgrp->kn, name, kn);
	}" \
              kernel/cgroup/cgroup.c
            echo "Patch 2 (cgroup prefix) applied"
          else
            echo "Could not find anchor line for patch 2"
          fi

      - name: Build kernel
        run: |
          export ARCH=arm64
          export PATH="/tmp/clang/bin:/tmp/gas:/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="/tmp/clang/lib64:${LD_LIBRARY_PATH}"
          export KBUILD_BUILD_USER="Droidspaces-Build"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          
          make -j$(nproc) O=out ARCH=$ARCH \
            LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            $DEFCONFIG 2>&1 | tail -10
          
          if [ "$DEFCONFIG" = "alioth_stock-defconfig" ]; then
            scripts/config --file out/.config \
              --set-str CONFIG_LOCALVERSION "-droidspaces-ksu" \
              -d CONFIG_LOCALVERSION_AUTO
            make -j$(nproc) O=out ARCH=$ARCH \
              LLVM=1 LLVM_IAS=1 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              olddefconfig 2>&1 | tail -5
          fi
          
          make -j$(nproc) O=out ARCH=$ARCH \
            LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            2>&1 | tee build.log | tail -30
          
          find out/arch/arm64/boot/dts/vendor/qcom -name '*.dtb' -exec cat {} + >out/arch/arm64/boot/dtb 2>/dev/null || true
          echo "Build complete!"

      - name: Package with AnyKernel3
        run: |
          mkdir -p anykernel/kernels/alioth
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/kernels/alioth
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/kernels/alioth
          fi
          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb anykernel/kernels/alioth
          fi
          find out/arch/arm64/boot -name "dtbo.img" -exec cp {} anykernel/kernels/alioth \; 2>/dev/null || true
          cd anykernel
          ZIPNAME="Kernel-alioth-Droidspaces-KSU-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIPNAME" ./* -x .git .gitignore ./*.zip
          cd ..
          echo "Packaged: $ZIPNAME"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alioth-kernel-droidspaces-ksu-${{ env.BRANCH }}
          path: |
            *.zip
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7
