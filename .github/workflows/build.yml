name: Build Kernel (alioth-stock + Droidspaces + KernelSU)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: '13.0-alioth'
        type: choice
        options:
          - 13.0-alioth
          - 14.0-alioth
          - 15.0-alioth
          - 16.0-alioth
  push:
    branches:
      - 13.0-alioth
      - 14.0-alioth
      - 15.0-alioth
      - 16.0-alioth

env:
  TARGET_ARCH: arm64
  KERNEL_CONFIG: alioth_stock-defconfig
  CLANG_VERSION: 14.0.7

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup AOSP Clang toolchain
        run: |
          mkdir -p /tmp/toolchains
          cd /tmp/toolchains
          # Download AOSP prebuilt clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          mkdir -p clang-r450784d && tar xzf clang-r450784d.tar.gz -C clang-r450784d
          echo "/tmp/toolchains/clang-r450784d/bin" >> $GITHUB_PATH
          # Download aarch64 cross-compiler
          curl -LO https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz
          mkdir -p aarch64-linux-android-4.9 && tar xzf main.tar.gz -C aarch64-linux-android-4.9
          echo "/tmp/toolchains/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          # Download arm cross-compiler
          curl -LO https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/main.tar.gz
          mkdir -p arm-linux-androideabi-4.9 && tar xzf main.tar.gz -C arm-linux-androideabi-4.9
          echo "/tmp/toolchains/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH
          echo "TOOLCHAIN_PATH=/tmp/toolchains" >> $GITHUB_ENV

      - name: Update KernelSU to latest
        run: |
          # Remove old KernelSU submodule
          git submodule deinit -f KernelSU 2>/dev/null || true
          rm -rf KernelSU
          # Clone latest KernelSU source into KernelSU directory
          git clone --depth 1 --branch main https://github.com/tiann/KernelSU.git KernelSU-tmp
          # Only copy the kernel module source (kernel/ directory -> KernelSU/)
          rm -rf KernelSU
          mkdir -p KernelSU
          cp -r KernelSU-tmp/kernel/* KernelSU/
          rm -rf KernelSU-tmp
          # Add to git so it's tracked
          git add KernelSU/
          echo "KernelSU updated to latest commit: $(git -C KernelSU rev-parse HEAD 2>/dev/null || echo 'unknown')"

      - name: Apply Droidspaces kernel config
        run: |
          cat >> arch/arm64/configs/alioth_stock-defconfig << 'DROIDSPACES_CONFIG'

          # Droidspaces mandatory configuration
          # IPC mechanisms
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Core namespace support
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y

          # Seccomp
          CONFIG_SECCOMP_FILTER=y

          # Control groups
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_NET_PRIO=y

          # Device filesystem
          CONFIG_DEVTMPFS=y

          # Firmware
          CONFIG_FW_LOADER_COMPRESS=y

          # Network
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NF_TABLES=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y

          # Legacy compat
          CONFIG_NF_CONNTRACK_IPV4=y

          # User namespace
          CONFIG_USER_NS=y
DROIDSPACES_CONFIG
          echo "Droidspaces config applied."

      - name: Apply Droidspaces non-GKI patches
        run: |
          # Patch 1: fix kernel panic in xt_qtaguid
          cat > /tmp/patch1.patch << 'PATCH1'
diff --git a/net/netfilter/xt_qtaguid.c b/net/netfilter/xt_qtaguid.c
index 8cb9c30bf..bf4bd9f56 100755
--- a/net/netfilter/xt_qtaguid.c
+++ b/net/netfilter/xt_qtaguid.c
@@ -739,7 +739,7 @@ static int iface_stat_fmt_proc_show(struct seq_file *m, void *v)
 {
 	struct proc_iface_stat_fmt_info *p = m->private;
 	struct iface_stat *iface_entry;
-	struct rtnl_link_stats64 dev_stats, *stats;
+	struct rtnl_link_stats64 *stats;
 	struct rtnl_link_stats64 no_dev_stats = {0};
 
 
@@ -748,12 +748,8 @@ static int iface_stat_fmt_proc_show(struct seq_file *m, void *v)
 
 	iface_entry = list_entry(v, struct iface_stat, list);
 
-	if (iface_entry->active) {
-		stats = dev_get_stats(iface_entry->net_dev,
-				      &dev_stats);
-	} else {
-		stats = &no_dev_stats;
-	}
+	stats = &no_dev_stats;
+
 	/*
 	 * If the meaning of the data changes, then update the fmtX
 	 * string.
PATCH1
          patch -p1 < /tmp/patch1.patch || echo "Patch 1 already applied or failed, continuing..."
          
          # Patch 2: fix restore cgroup file prefix handling
          cat > /tmp/patch2.patch << 'PATCH2'
diff --git a/kernel/cgroup/cgroup.c b/kernel/cgroup/cgroup.c
index 694b1cc8d..d0d04bff1 100755
--- a/kernel/cgroup/cgroup.c
+++ b/kernel/cgroup/cgroup.c
@@ -3496,6 +3496,11 @@ static int cgroup_add_file(struct cgroup_subsys_state *css, struct cgroup *cgrp,
 		spin_unlock_irq(&cgroup_file_kn_lock);
 	}
 
+	if (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) && !(cft->flags & CFTYPE_NO_PREFIX)) {
+				snprintf(name, CGROUP_FILE_NAME_MAX, "%s.%s", cft->ss->name, cft->name);
+				kernfs_create_link(cgrp->kn, name, kn);
+	}
+
 	return 0;
 }
PATCH2
          patch -p1 < /tmp/patch2.patch || echo "Patch 2 already applied or failed, continuing..."
          
          echo "Droidspaces patches applied."

      - name: Verify defconfig
        run: |
          echo "=== Checking critical config options ==="
          for opt in SYSVIPC POSIX_MQUEUE PID_NS IPC_NS DEVTMPFS CGROUP_DEVICE; do
            grep -q "CONFIG_${opt}=y" arch/arm64/configs/alioth_stock-defconfig && \
              echo "✅ CONFIG_${opt}=y" || echo "❌ CONFIG_${opt}=y MISSING"
          done
          echo "=== KernelSU config ==="
          grep "CONFIG_KSU" arch/arm64/configs/alioth_stock-defconfig || echo "CONFIG_KSU not in defconfig (will use Kconfig default)"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          
          # Generate defconfig
          make O=out ARCH=$ARCH LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
            $KERNEL_CONFIG 2>&1 | tail -20
          
          # Build kernel
          make O=out ARCH=$ARCH LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
            -j$(nproc) 2>&1 | tail -30
          
          echo "Build complete!"

      - name: Package kernel
        run: |
          # Copy built kernel image
          mkdir -p /tmp/artifact
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image /tmp/artifact/
            echo "✅ Image built"
          fi
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz /tmp/artifact/
          fi
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img /tmp/artifact/ 2>/dev/null || true
          fi
          # List DTBO files
          find out/arch/arm64/boot -name "*.dtbo" -exec cp {} /tmp/artifact/ \; 2>/dev/null || true
          # Also copy vmlinux for debugging
          cp vmlinux /tmp/artifact/vmlinux 2>/dev/null || true
          ls -la /tmp/artifact/

      - name: Create release artifact
        run: |
          cd /tmp/artifact
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          KSU_VER=$(grep "KSU_VERSION" KernelSU/include/version.h 2>/dev/null | head -1 || echo "KSU-$(cd KernelSU && git rev-parse --short HEAD 2>/dev/null || echo 'unknown')")
          # Handle case where KernelSU dir structure may vary
          KSU_TAG=$(cd /tmp/artifact/KernelSU 2>/dev/null && git describe --tags 2>/dev/null || echo "latest")
          tar czf ~/kernel-alioth-droidspaces-${BUILD_DATE}.tar.gz Image Image.gz dtb.img *.dtbo vmlinux 2>/dev/null || \
          tar czf ~/kernel-alioth-droidspaces-${BUILD_DATE}.tar.gz Image Image.gz vmlinux 2>/dev/null || \
          tar czf ~/kernel-alioth-droidspaces-${BUILD_DATE}.tar.gz Image vmlinux 2>/dev/null || \
          echo "Warning: Some artifacts missing"
          ls -la ~/kernel-alioth-droidspaces-*.tar.gz

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: alioth-kernel-droidspaces-ksu
          path: /tmp/artifact/*
          if-no-files-found: warn
          retention-days: 7
