name: Build Kernel (alioth-stock + Droidspaces + KernelSU)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from
        required: false
        default: '13.0-alioth'
        type: choice
        options:
          - 13.0-alioth
          - 14.0-alioth
          - 15.0-alioth
          - 16.0-alioth
      defconfig:
        description: Defconfig to use
        required: false
        default: 'alioth_stock-defconfig'
        type: choice
        options:
          - alioth_stock-defconfig
          - alioth_defconfig

env:
  TARGET_ARCH: arm64
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'alioth_stock-defconfig' }}
  BRANCH: ${{ github.event.inputs.branch || '13.0-alioth' }}

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.BRANCH }}

      - name: Add Swap (5GB)
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 5G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential bc curl libssl-dev git zip python3 python3-pip flex cpio libncurses5-dev wget patchelf llvm lld
          sudo pip3 install pyelftools

      - name: Setup toolchain
        run: |
          cd /tmp
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth=1 -b 11 clang
          echo "/tmp/clang/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/tmp/clang/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 --depth=1 /tmp/gas
          echo "/tmp/gas" >> $GITHUB_PATH
          git clone https://github.com/UtsavBalar1231/Anykernel3 --depth=1 -b kona anykernel

      - name: Update KernelSU to latest
        run: |
          rm -rf KernelSU .gitmodules 2>/dev/null || true
          git clone --depth 1 https://github.com/tiann/KernelSU.git /tmp/KernelSU-src
          mkdir -p KernelSU
          cp -r /tmp/KernelSU-src/kernel/* KernelSU/
          rm -rf /tmp/KernelSU-src

      - name: Apply Droidspaces kernel config
        run: |
          CFG=arch/arm64/configs/$DEFCONFIG
          echo 'CONFIG_SYSVIPC=y' >> $CFG
          echo 'CONFIG_POSIX_MQUEUE=y' >> $CFG
          echo 'CONFIG_PID_NS=y' >> $CFG
          echo 'CONFIG_IPC_NS=y' >> $CFG
          echo 'CONFIG_CGROUP_DEVICE=y' >> $CFG
          echo 'CONFIG_CGROUP_PIDS=y' >> $CFG
          echo 'CONFIG_CGROUP_NET_PRIO=y' >> $CFG
          echo 'CONFIG_DEVTMPFS=y' >> $CFG
          echo 'CONFIG_FW_LOADER_COMPRESS=y' >> $CFG
          echo 'CONFIG_BRIDGE_NETFILTER=y' >> $CFG
          echo 'CONFIG_NF_TABLES=y' >> $CFG
          echo 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y' >> $CFG
          echo 'CONFIG_NETFILTER_XT_TARGET_TCPMSS=y' >> $CFG
          echo 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' >> $CFG
          echo 'CONFIG_NF_CONNTRACK_NETLINK=y' >> $CFG
          echo 'CONFIG_NF_CONNTRACK_IPV4=y' >> $CFG
          echo 'CONFIG_USER_NS=y' >> $CFG

      - name: Apply Droidspaces non-GKI patches
        run: |
          echo '' | base64 -d > /tmp/patch1.patch
          echo '' | base64 -d > /tmp/patch2.patch
          patch -p1 < /tmp/patch1.patch
          patch -p1 < /tmp/patch2.patch
          echo "Both patches applied"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export PATH="/tmp/clang/bin:/tmp/gas:/usr/bin:$PATH"
          export LD_LIBRARY_PATH="/tmp/clang/lib64:$LD_LIBRARY_PATH"
          export KBUILD_BUILD_USER="Droidspaces-Build"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          make -j$(nproc) O=out ARCH=$ARCH LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- $DEFCONFIG 2>&1 | tail -10
          make -j$(nproc) O=out ARCH=$ARCH LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- 2>&1 | tee build.log | tail -30
          find out/arch/arm64/boot/dts/vendor/qcom -name '*.dtb' -exec cat {} + >out/arch/arm64/boot/dtb 2>/dev/null || true

      - name: Package with AnyKernel3
        run: |
          mkdir -p anykernel/kernels/alioth
          cp out/arch/arm64/boot/Image anykernel/kernels/alioth 2>/dev/null || cp out/arch/arm64/boot/Image.gz anykernel/kernels/alioth 2>/dev/null || true
          cp out/arch/arm64/boot/dtb anykernel/kernels/alioth 2>/dev/null || true
          find out/arch/arm64/boot -name "dtbo.img" -exec cp {} anykernel/kernels/alioth 2>/dev/null \; || true
          cd anykernel
          ZIPNAME="Kernel-alioth-Droidspaces-KSU-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIPNAME" ./* -x .git .gitignore ./*.zip
          cd ..

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alioth-kernel-droidspaces-ksu-${{ env.BRANCH }}
          path: |
            *.zip
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7
